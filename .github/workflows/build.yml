name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 构建只需要读代码；只有发布 job 需要写 Release
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # 标签构建不要被后续提交互相取消
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_VERSION: 9.0.x
  PROJECT_DIR: app/FanqieReader
  # 用 ASCII 路径，避免 Windows runner 上中文路径带来的编码问题。
  # zip 里是这个目录的“内容”，所以解压后的文件夹名不受影响。
  PUBLISH_DIR: dist/package

jobs:
  build:
    name: build (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --version
          node --version

      - name: Check web assets syntax
        shell: pwsh
        run: node --check "$env:GITHUB_WORKSPACE/$env:PROJECT_DIR/WebAssets/app.js"

      - name: Restore
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: dotnet restore --nologo

      - name: Build (Release)
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: dotnet build -c Release --no-restore --nologo

      - name: Publish (self-contained win-x64)
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE $env:PUBLISH_DIR
          Write-Host "publishing to $out"
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false -p:PublishTrimmed=false `
            --output $out --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }

      - name: Verify package contents
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE $env:PUBLISH_DIR
          if (-not (Test-Path $dir)) { throw "publish output missing: $dir" }

          # createdump.exe ships with the .NET runtime, the other one is the app
          $exe = @(Get-ChildItem $dir -Filter '*.exe' -File | Where-Object { $_.Name -ne 'createdump.exe' })
          if ($exe.Count -ne 1) { throw "expected exactly one app exe, found $($exe.Count)" }

          foreach ($rel in @('FanqieReader.dll', 'WebAssets/index.html', 'WebAssets/app.js', 'WebAssets/styles.css')) {
            $path = Join-Path $dir $rel
            if (-not (Test-Path $path)) { throw "missing in package: $rel" }
          }

          $files = Get-ChildItem $dir -Recurse -File
          $size = [math]::Round((($files | Measure-Object -Sum Length).Sum) / 1MB, 1)
          Write-Host ("package: {0} files, {1} MB, exe = {2}" -f $files.Count, $size, $exe[0].Name)
          # a self-contained .NET desktop runtime alone is 250+ files; fewer means publish did not finish
          if ($files.Count -lt 200) { throw "package looks incomplete: only $($files.Count) files" }

      - name: Package zip
        id: package
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $label = if ("${{ github.ref_type }}" -eq 'tag') { "${{ github.ref_name }}" } else { "main-$sha" }

          $zip = Join-Path $env:GITHUB_WORKSPACE "dist/fanqienovel-immersive-reader-$label-win-x64.zip"
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE "$env:PUBLISH_DIR/*") `
                           -DestinationPath $zip -CompressionLevel Optimal

          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host ("zip: {0} ({1} MB)" -f (Split-Path $zip -Leaf), $mb)

          "zip_path=$zip" >> $env:GITHUB_OUTPUT
          "zip_name=$(Split-Path $zip -Leaf)" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanqienovel-immersive-reader-win-x64
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: fanqienovel-immersive-reader-win-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
